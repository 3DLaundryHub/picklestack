<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Roster in, rounds out: House of Picklers builds pickleball rotations, records scores and keeps the standings live.">
<meta name="theme-color" content="#098476">
<title>House of Picklers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  color-scheme: light;
  --ground:#F2FBF8;
  --surface:#FFFFFF;
  --surface-2:#E9F8F3;
  --sunk:#D8F2EA;
  --line:#B9E6DA;
  --line-soft:#DBF2EA;
  --ink:#0C2A25;
  --ink-2:#2F544B;
  --muted:#54786E;
  --accent:#098476;
  --accent-bright:#0FD9BE;
  --accent-ink:#FFFFFF;
  --accent-soft:#C6F7EC;
  --optic:#DCEF3F;
  --optic-ink:#2A3306;
  --sun:#FF9F1C;
  --sun-soft:#FFF0D2;
  --win:#0B8551;
  --win-soft:#C9F7DF;
  --loss:#D0402A;
  --loss-soft:#FFE0D8;
  --warn:#A35F06;
  --shadow:0 1px 2px rgba(12,42,37,.05), 0 12px 26px -18px rgba(9,132,118,.45);
  --radius:14px;
  --radius-sm:9px;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",system-ui,sans-serif;
  --f-data:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0C1C19;
    --surface:#152724;
    --surface-2:#1C322D;
    --sunk:#112220;
    --line:#294039;
    --line-soft:#1F332F;
    --ink:#E9F5F1;
    --ink-2:#BAD2CB;
    --muted:#8AAAA0;
    --accent:#3ED9C0;
    --accent-bright:#5BF0D6;
    --accent-ink:#032420;
    --accent-soft:#12443C;
    --optic:#DCEF3F;
    --optic-ink:#222A05;
    --sun:#FFB23F;
    --sun-soft:#3E2D10;
    --win:#4BE09B;
    --win-soft:#0F3D29;
    --loss:#FF9683;
    --loss-soft:#42211B;
    --warn:#F0B257;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 26px -18px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
    color-scheme: dark;
  --ground:#0C1C19;
  --surface:#152724;
  --surface-2:#1C322D;
  --sunk:#112220;
  --line:#294039;
  --line-soft:#1F332F;
  --ink:#E9F5F1;
  --ink-2:#BAD2CB;
  --muted:#8AAAA0;
  --accent:#3ED9C0;
  --accent-bright:#5BF0D6;
  --accent-ink:#032420;
  --accent-soft:#12443C;
  --optic:#DCEF3F;
  --optic-ink:#222A05;
  --sun:#FFB23F;
  --sun-soft:#3E2D10;
  --win:#4BE09B;
  --win-soft:#0F3D29;
  --loss:#FF9683;
  --loss-soft:#42211B;
  --warn:#F0B257;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 26px -18px rgba(0,0,0,.85);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
h1,h2,h3{font-family:var(--f-display); margin:0; text-wrap:balance; letter-spacing:-.015em}
p{margin:0}
table{border-collapse:collapse}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.shell{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
.topbar{position:sticky;top:0;z-index:30;background:var(--ground);padding-block:12px 8px;
  border-bottom:1px solid var(--line-soft);margin-inline:-16px;padding-inline:16px}
.topbar-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:800;
  font-size:17px;letter-spacing:-.03em;margin-right:auto}
.brand .ball{width:11px;height:11px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#F2FF6B,var(--optic) 70%);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--optic) 34%,transparent);align-self:center}
.sess-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;min-height:22px}
.sess-name{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.01em}
.sess-meta{font-size:12px;color:var(--muted);font-family:var(--f-data);letter-spacing:-.01em}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--radius-sm);padding:8px 12px;font-weight:500;font-size:14px;white-space:nowrap;
  transition:background .12s ease,border-color .12s ease,transform .06s ease}
.btn:active{transform:translateY(1px)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent-bright) 55%,var(--accent)));
  border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 35%,transparent)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none}
.icon-btn{width:34px;height:34px;padding:0;border-radius:var(--radius-sm);display:inline-flex;
  align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface)}
.input,select.input{width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:9px 11px;color:var(--ink)}
.input::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.field{display:flex;flex-direction:column;gap:5px}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;
  font-size:11.5px;font-weight:600;letter-spacing:.03em;background:var(--sunk);color:var(--ink-2)}
.pill.live{background:var(--optic);color:var(--optic-ink)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.win{background:var(--win-soft);color:var(--win)}
.pill.sample{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.muted{color:var(--muted)}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.section-head{display:flex;align-items:flex-end;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.section-head h2{font-size:17px;font-weight:700;flex:0 0 auto}
.section-head .hint{font-size:12.5px;color:var(--muted);margin-left:auto;text-align:right;flex:1 1 auto;min-width:0}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:26px 18px;text-align:center;color:var(--muted)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- tabs ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;gap:2px}
.tabbar button{flex:1;background:none;border:0;padding:6px 2px 5px;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
.tabbar button .glyph{display:flex;line-height:0}
.tabbar button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.tab-count{font-family:var(--f-data);font-size:10px}

/* ---------- court card ---------- */
.courts{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:760px){.courts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.court{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.court.done{box-shadow:none;border-color:var(--line-soft);background:var(--surface-2)}
.court-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line-soft);
  background:linear-gradient(95deg,color-mix(in srgb,var(--optic) 16%,var(--surface)),var(--surface-2) 70%)}
.court.done .court-head{background:transparent}
.court-no{font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.court-no b{color:var(--ink);font-size:14px;letter-spacing:0}
.teams{display:flex;flex-direction:column}
.team{display:flex;align-items:center;gap:10px;padding:11px 12px}
.team + .team{border-top:1px solid var(--line-soft)}
.team.winner{background:linear-gradient(90deg,var(--win-soft),transparent 78%)}
.team-names{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.pname{font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere;
  background:none;border:0;padding:0;text-align:left;color:inherit}
.pname:hover{color:var(--accent);text-decoration:underline dotted}
.pname .seed{font-family:var(--f-data);font-size:11px;color:var(--muted);margin-left:5px}
.vs-rule{display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted);
  font-family:var(--f-data);font-size:10.5px;letter-spacing:.16em}
.vs-rule::before,.vs-rule::after{content:"";height:1px;background:var(--line-soft);flex:1}
.score-box{display:flex;align-items:center;gap:4px}
.score-val{font-family:var(--f-data);font-weight:500;font-size:26px;min-width:2.1ch;text-align:center;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score-val.dim{color:color-mix(in srgb,var(--muted) 60%,transparent)}
.step{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;color:var(--ink-2)}
.step:hover{background:var(--sunk)}
.court-foot{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.court-foot .note{font-size:12px;color:var(--muted);font-family:var(--f-data)}
.quick{display:flex;gap:5px;flex-wrap:wrap}
.quick button{font-family:var(--f-data);font-size:12px;padding:4px 8px;border-radius:7px;
  border:1px solid var(--line);background:var(--surface)}
.quick button:hover{background:var(--accent-soft);border-color:var(--accent)}

/* ---------- round nav ---------- */
.roundnav{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
.roundnav .rtitle{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.025em}
.roundnav .rsub{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.sitout{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:var(--radius);
  border:1px dashed color-mix(in srgb,var(--sun) 45%,var(--line));background:var(--sun-soft);
  color:var(--ink-2);font-size:13px}
.sitout .who{display:flex;gap:6px;flex-wrap:wrap}
.sitout .who span{background:var(--surface);color:var(--ink-2);border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:500;
  border:1px solid color-mix(in srgb,var(--sun) 30%,transparent)}

/* ---------- roster ---------- */
.roster{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.ritem{display:flex;align-items:center;gap:10px;padding:9px 12px}
.ritem + .ritem{border-top:1px solid var(--line-soft)}
.ritem.out{background:var(--surface-2)}
.ritem.out .rname{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.rname{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.rstat{font-family:var(--f-data);font-size:11.5px;color:var(--muted);white-space:nowrap}
.toggle{position:relative;width:40px;height:23px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .14s ease}
.toggle[aria-pressed="true"]{background:var(--accent-bright);border-color:var(--accent-bright)}
.toggle[aria-pressed="true"]::after{transform:translateX(17px)}

/* ---------- standings ---------- */
.table{width:100%;font-size:14px;min-width:520px}
.table th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  font-weight:700;text-align:right;padding:0 8px 8px;white-space:nowrap}
.table th:first-child,.table th:nth-child(2){text-align:left}
.table td{padding:9px 8px;border-top:1px solid var(--line-soft);text-align:right;
  font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
.table td:nth-child(2){text-align:left;font-family:var(--f-body);font-weight:600}
.table td:first-child{text-align:left;color:var(--muted);width:34px}
.table tbody tr:nth-child(-n+3) td:first-child{color:var(--ink);font-weight:500}
.table .lead td{background:linear-gradient(90deg,var(--accent-soft),transparent 72%)}
.table td.pos{color:var(--win)} .table td.neg{color:var(--loss)}
.table tfoot td{border-top:1px solid var(--line);color:var(--muted);font-size:12px}

/* ---------- rotation ---------- */
.statgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.stat{border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;background:var(--surface)}
.stat .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.03em;margin-top:3px}
.stat .v small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.meter{height:5px;border-radius:999px;background:var(--sunk);margin-top:9px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-bright));border-radius:999px}
.matrix{border-collapse:separate;border-spacing:2px;font-family:var(--f-data);font-size:11px}
.matrix th{color:var(--muted);font-weight:500;padding:2px 4px;white-space:nowrap;text-align:right}
.matrix thead th{writing-mode:vertical-rl;transform:rotate(180deg);height:76px;text-align:left;vertical-align:bottom}
.matrix td{width:24px;height:24px;text-align:center;border-radius:5px;background:var(--sunk);color:var(--muted)}
.matrix td.self{background:transparent;color:color-mix(in srgb,var(--muted) 40%,transparent)}
.matrix td.c0{background:var(--sunk);color:color-mix(in srgb,var(--muted) 55%,transparent)}
.matrix td.c1{background:var(--accent-soft);color:var(--accent);font-weight:500}
.matrix td.c2{background:color-mix(in srgb,var(--accent-bright) 55%,var(--surface));color:var(--accent-ink)}
.matrix td.c3{background:var(--accent-bright);color:var(--accent-ink);font-weight:500}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.pairlist{font-size:13px;color:var(--muted);line-height:1.6}
.pairlist b{color:var(--ink);font-weight:600}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,20,17,.44);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;
  width:100%;max-width:520px;max-height:86vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:640px){.sheet{border-radius:16px;max-height:80vh}}
.sheet h3{font-size:17px;font-weight:700;margin-bottom:2px}
.sheet .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.choice{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;
  border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);margin-bottom:7px}
.choice:hover{background:var(--surface-2);border-color:var(--accent)}
.choice .c-main{font-weight:600}
.choice .c-sub{font-size:12px;color:var(--muted);font-family:var(--f-data)}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:6px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));
  z-index:60;background:var(--ink);color:var(--ground);padding:9px 15px;border-radius:999px;
  font-size:13.5px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

/* ---------- welcome ---------- */
.hero{padding:26px 0 6px}
.hero h1{font-size:clamp(28px,7vw,40px);font-weight:800;letter-spacing:-.04em;line-height:1.02}
.hero p{color:var(--muted);margin-top:10px;max-width:60ch;font-size:15px}
.court-mark{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:54px;height:36px;
  border:1.5px solid var(--accent);border-radius:3px;padding:3px;margin-bottom:14px}
.court-mark i{background:var(--accent-soft);border-radius:1px}
.court-mark i:nth-child(2),.court-mark i:nth-child(3){background:color-mix(in srgb,var(--optic) 40%,var(--surface))}
.score-val::placeholder{color:color-mix(in srgb,var(--muted) 45%,transparent)}
</style>
</head>
<body>
<div id="app"></div>
<noscript><div style="padding:32px 16px;font-family:system-ui">House of Picklers needs JavaScript to build the rounds and keep score.</div></noscript>
<script>
/* ===========================================================
   House of Picklers — rotation engine
   Builds rounds that maximise how many different people each
   player partners with and plays against, while keeping games
   played and sit-outs even across the roster.
   =========================================================== */
const Sched = (function () {
  "use strict";

  const W_PARTNER = 14;   // repeating a partner is the costliest repeat
  const W_OPPONENT = 4;   // repeating an opponent costs less
  const W_BALANCE = 1.2;  // mild pull toward even team strength

  function key(a, b) { return a < b ? a + "|" + b : b + "|" + a; }

  /* ---- counters over every round already on the board ---- */
  function tally(session) {
    const t = {
      games: {}, sits: {}, lastPlayed: {}, lastSat: {},
      partner: {}, opponent: {}, roundsCount: session.rounds.length
    };
    session.players.forEach(function (p) {
      t.games[p.id] = 0; t.sits[p.id] = 0;
      t.lastPlayed[p.id] = -99; t.lastSat[p.id] = -99;
    });
    session.rounds.forEach(function (round, ri) {
      round.matches.forEach(function (m) {
        const all = m.teamA.concat(m.teamB);
        all.forEach(function (id) {
          if (t.games[id] === undefined) return;
          t.games[id]++; t.lastPlayed[id] = ri;
        });
        [m.teamA, m.teamB].forEach(function (team) {
          for (let i = 0; i < team.length; i++)
            for (let j = i + 1; j < team.length; j++) {
              const k = key(team[i], team[j]);
              t.partner[k] = (t.partner[k] || 0) + 1;
            }
        });
        m.teamA.forEach(function (a) {
          m.teamB.forEach(function (b) {
            const k = key(a, b);
            t.opponent[k] = (t.opponent[k] || 0) + 1;
          });
        });
      });
      (round.sitting || []).forEach(function (id) {
        if (t.sits[id] === undefined) return;
        t.sits[id]++; t.lastSat[id] = ri;
      });
    });
    return t;
  }

  function partnerCount(t, a, b) { return t.partner[key(a, b)] || 0; }
  function opponentCount(t, a, b) { return t.opponent[key(a, b)] || 0; }

  /* ---- who gets on court this round ---- */
  function pickPlayers(session, t, need, ratings) {
    const pool = session.players.filter(function (p) { return p.active !== false; });
    if (pool.length <= need) return pool.map(function (p) { return p.id; });
    const scored = pool.map(function (p) {
      return {
        id: p.id,
        // fewest games first; among equals, whoever sat most (and most recently)
        score: t.games[p.id] * 1000
             - t.sits[p.id] * 60
             - (t.lastSat[p.id] === t.roundsCount - 1 ? 40 : 0)
             + Math.random() * 12
      };
    });
    scored.sort(function (a, b) { return a.score - b.score; });
    return scored.slice(0, need).map(function (s) { return s.id; });
  }

  /* ---- cost of one court ---- */
  function courtCost(t, group, split, ratings) {
    const A = [group[split[0]], group[split[1]]];
    const B = [group[split[2]], group[split[3]]];
    let c = W_PARTNER * (partnerCount(t, A[0], A[1]) + partnerCount(t, B[0], B[1]));
    for (let i = 0; i < A.length; i++)
      for (let j = 0; j < B.length; j++) c += W_OPPONENT * opponentCount(t, A[i], B[j]);
    if (ratings) {
      const sa = (ratings[A[0]] || 0) + (ratings[A[1]] || 0);
      const sb = (ratings[B[0]] || 0) + (ratings[B[1]] || 0);
      c += W_BALANCE * Math.abs(sa - sb);
    }
    return c;
  }

  const SPLITS = [[0, 1, 2, 3], [0, 2, 1, 3], [0, 3, 1, 2]];

  function bestSplit(t, group, ratings) {
    let best = null;
    SPLITS.forEach(function (s) {
      const c = courtCost(t, group, s, ratings);
      if (!best || c < best.cost) best = { cost: c, split: s };
    });
    return best;
  }

  function singlesCost(t, pair, ratings) {
    let c = W_OPPONENT * 3 * opponentCount(t, pair[0], pair[1]);
    if (ratings) c += W_BALANCE * Math.abs((ratings[pair[0]] || 0) - (ratings[pair[1]] || 0));
    return c;
  }

  function totalCost(t, order, size, ratings) {
    let sum = 0;
    for (let i = 0; i < order.length; i += size) {
      const group = order.slice(i, i + size);
      sum += size === 4 ? bestSplit(t, group, ratings).cost : singlesCost(t, group, ratings);
    }
    return sum;
  }

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const x = a[i]; a[i] = a[j]; a[j] = x;
    }
    return a;
  }

  /* ---- randomised restarts + pairwise local search ---- */
  function optimise(ids, t, size, ratings) {
    let bestOrder = null, bestCost = Infinity;
    const restarts = ids.length > 16 ? 14 : 30;
    for (let r = 0; r < restarts; r++) {
      let order = shuffled(ids);
      let cost = totalCost(t, order, size, ratings);
      let improved = true, guard = 0;
      while (improved && guard++ < 60) {
        improved = false;
        for (let i = 0; i < order.length; i++) {
          for (let j = i + 1; j < order.length; j++) {
            if (Math.floor(i / size) === Math.floor(j / size)) continue; // same court: split handles it
            const tmp = order[i]; order[i] = order[j]; order[j] = tmp;
            const c = totalCost(t, order, size, ratings);
            if (c < cost - 1e-9) { cost = c; improved = true; }
            else { order[j] = order[i]; order[i] = tmp; }
          }
        }
      }
      if (cost < bestCost) { bestCost = cost; bestOrder = order; }
      if (bestCost === 0) break;
    }
    return { order: bestOrder, cost: bestCost };
  }

  /* ---- Mexicano: rank-seeded courts, 1&4 v 2&3 ---- */
  function mexicanoOrder(ids, standings) {
    const rank = {};
    standings.forEach(function (s, i) { rank[s.id] = i; });
    return ids.slice().sort(function (a, b) {
      return (rank[a] === undefined ? 999 : rank[a]) - (rank[b] === undefined ? 999 : rank[b]);
    });
  }

  /* ---- public: build the next round ---- */
  function buildRound(session, standings) {
    const size = session.mode === "singles" ? 2 : 4;
    const active = session.players.filter(function (p) { return p.active !== false; });
    if (active.length < size) {
      return { error: "Need at least " + size + " checked-in players for " + (size === 2 ? "singles" : "doubles") + "." };
    }
    const t = tally(session);
    const capacity = Math.min(session.courts * size, Math.floor(active.length / size) * size);
    const ratings = session.balance ? ratingMap(standings) : null;

    const chosen = pickPlayers(session, t, capacity, ratings);
    const chosenSet = {};
    chosen.forEach(function (id) { chosenSet[id] = true; });

    let order, cost;
    if (session.format === "mexicano" && standings && standings.length) {
      order = mexicanoOrder(chosen, standings);
      cost = totalCost(t, order, size, null);
    } else {
      const r = optimise(chosen, t, size, ratings);
      order = r.order; cost = r.cost;
    }

    const matches = [];
    let court = 1;
    for (let i = 0; i < order.length; i += size) {
      const group = order.slice(i, i + size);
      let teamA, teamB;
      if (size === 2) { teamA = [group[0]]; teamB = [group[1]]; }
      else if (session.format === "mexicano") {
        teamA = [group[0], group[3]]; teamB = [group[1], group[2]];   // 1&4 v 2&3
      } else {
        const s = bestSplit(t, group, ratings).split;
        teamA = [group[s[0]], group[s[1]]];
        teamB = [group[s[2]], group[s[3]]];
      }
      matches.push({
        id: "m" + Date.now().toString(36) + court + Math.random().toString(36).slice(2, 6),
        court: court++, teamA: teamA, teamB: teamB, a: null, b: null, done: false
      });
    }
    const sitting = active.filter(function (p) { return !chosenSet[p.id]; }).map(function (p) { return p.id; });
    return { matches: matches, sitting: sitting, repeatCost: cost };
  }

  function ratingMap(standings) {
    if (!standings || !standings.length) return null;
    const m = {};
    standings.forEach(function (s) {
      m[s.id] = s.gp ? (s.pf - s.pa) / s.gp : 0;
    });
    return m;
  }

  /* ---- rotation coverage report ---- */
  function coverage(session) {
    const t = tally(session);
    const ids = session.players.map(function (p) { return p.id; });
    const n = ids.length;
    const possible = n * (n - 1) / 2;
    let uniqPartners = 0, uniqOpponents = 0, repeatPartners = 0;
    const perPlayer = {};
    ids.forEach(function (id) { perPlayer[id] = { partners: {}, opponents: {}, missing: [] }; });

    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const p = partnerCount(t, ids[i], ids[j]);
        const o = opponentCount(t, ids[i], ids[j]);
        if (p > 0) { uniqPartners++; repeatPartners += p - 1; }
        if (o > 0) uniqOpponents++;
        if (p === 0 && o === 0) {
          perPlayer[ids[i]].missing.push(ids[j]);
          perPlayer[ids[j]].missing.push(ids[i]);
        }
        perPlayer[ids[i]].partners[ids[j]] = p;
        perPlayer[ids[j]].partners[ids[i]] = p;
        perPlayer[ids[i]].opponents[ids[j]] = o;
        perPlayer[ids[j]].opponents[ids[i]] = o;
      }
    }
    return {
      tally: t, perPlayer: perPlayer, possiblePairs: possible,
      uniquePartners: uniqPartners, uniqueOpponents: uniqOpponents,
      repeatPartners: repeatPartners,
      partnerPct: possible ? uniqPartners / possible : 0,
      facedPct: possible ? (function () {
        let faced = 0;
        for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++)
          if (partnerCount(t, ids[i], ids[j]) + opponentCount(t, ids[i], ids[j]) > 0) faced++;
        return faced / possible;
      })() : 0
    };
  }

  return { buildRound: buildRound, tally: tally, coverage: coverage, key: key };
})();
